[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coreml-systemone"
version = "0.1.0"
description = "A local, Core ML-backed typed decision API for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "coremltools==9.0",
  "fastapi>=0.141,<1",
  "numpy>=2,<3",
  "torch==2.7.0",
  "transformers>=5.17,<6",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
